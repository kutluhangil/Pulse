name: Release Linux package

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  deb:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends python3-gi python3-gi-cairo python3-pytest gir1.2-gtk-4.0 gir1.2-adw-1 dpkg-dev
      - run: cp -R app/Packages/PulseKit/Tests/PulseCoreTests/Fixtures linux/tests/fixtures
      - run: cd linux && python3 -m pytest -q tests
      - name: Build
        run: linux/packaging/build-deb.sh "${GITHUB_REF_NAME#v}" dist
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "Pulse ${GITHUB_REF_NAME#v}" --notes ""
          gh release upload "$GITHUB_REF_NAME" dist/*.deb --clobber
