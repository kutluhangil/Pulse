name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  agent:
    name: Agent (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: agent/go.mod
          cache: false
      - run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go test -race ./...
      - run: go run honnef.co/go/tools/cmd/staticcheck@latest ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - name: Build image
        run: docker build --build-arg VERSION=ci -t pulse-agent:ci .

  app:
    name: App (Swift)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - run: brew install xcodegen swiftlint
      - name: Lint
        working-directory: app
        run: swiftlint lint --strict
      - name: Test PulseKit
        working-directory: app/Packages/PulseKit
        run: swift test
      - name: Build app
        working-directory: app
        run: |
          xcodegen generate
          xcodebuild -project Pulse.xcodeproj -scheme Pulse -configuration Release -derivedDataPath build/DerivedData -quiet build

  linux:
    name: Linux app (Python, GTK 4)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends python3-gi python3-gi-cairo python3-pytest gir1.2-gtk-4.0 gir1.2-adw-1 dpkg-dev
      - run: cp -R app/Packages/PulseKit/Tests/PulseCoreTests/Fixtures linux/tests/fixtures
      - run: cd linux && python3 -m pytest -q tests
      - run: linux/packaging/build-deb.sh 0.0.0~ci dist && dpkg-deb --info dist/pulse-monitor_0.0.0~ci_all.deb
