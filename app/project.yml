name: Pulse
options:
  bundleIdPrefix: com.kutluhangul
  deploymentTarget: { macOS: "26.0" }
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1
    ENABLE_HARDENED_RUNTIME: YES
    DEAD_CODE_STRIPPING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
packages:
  PulseKit: { path: Packages/PulseKit }
targets:
  Pulse:
    type: application
    platform: macOS
    sources: [App/Sources, App/Resources]
    dependencies:
      - package: PulseKit
        product: PulseCore
      - package: PulseKit
        product: PulseClient
      - package: PulseKit
        product: PulseUI
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Pulse
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.developer-tools
        NSHumanReadableCopyright: "© 2026 Kutluhan Gül · GPL-3.0"
        NSAppTransportSecurity: { NSAllowsLocalNetworking: true }
        CFBundleLocalizations: [en, tr]
    entitlements:
      path: App/Pulse.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kutluhangul.pulse
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_LSUIElement: YES
